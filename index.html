<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REACH Bible Study Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EA;
  --bg-2:#F4E7D0;
  --surface:#FFFFFF;
  --surface-2:#FFF8EE;
  --ink:#2B1D10;
  --muted:#7C6650;
  --line:rgba(43,29,16,.12);
  --orange:#EE7A1E;
  --gold:#F5B335;
  --ember:#C9500F;
  --good:#1F9A57;
  --bad:#D23F3F;
  --grad:linear-gradient(120deg,#F7B733 0%,#F08A24 45%,#DF5B14 100%);
  --wave-op:1;
  --shadow:0 18px 50px -20px rgba(160,80,10,.35);
  --card-shadow:0 2px 0 rgba(43,29,16,.06),0 20px 40px -24px rgba(120,60,10,.35);
  --display:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Mulish',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100A;--bg-2:#22180F;--surface:#221911;--surface-2:#2B2016;
    --ink:#FCF1E2;--muted:#C2A98C;--line:rgba(255,230,200,.12);
    --good:#3CCB7F;--bad:#FF6464;--wave-op:.75;
    --shadow:0 18px 60px -20px rgba(0,0,0,.7);
    --card-shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16100A;--bg-2:#22180F;--surface:#221911;--surface-2:#2B2016;
  --ink:#FCF1E2;--muted:#C2A98C;--line:rgba(255,230,200,.12);
  --good:#3CCB7F;--bad:#FF6464;--wave-op:.75;
  --shadow:0 18px 60px -20px rgba(0,0,0,.7);
  --card-shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body);background:var(--bg);color:var(--ink);
  line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}

/* Brand wave */
.wave{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:200px;pointer-events:none;z-index:0;opacity:var(--wave-op)}
.wave svg{width:100%;height:100%;display:block}
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0;background:radial-gradient(circle,#F7B733,transparent 65%);top:-30vmax;right:-20vmax}

.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 120px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(24px,5vw,48px)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1rem}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:var(--shadow)}
.brand small{display:block;font-family:var(--body);font-weight:600;color:var(--muted);font-size:.8rem;margin-top:-2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{height:42px;min-width:42px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9rem;transition:transform .15s,background .15s}
.icon-btn:hover{transform:translateY(-1px);background:var(--surface-2)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn .lbl{display:inline}
@media (max-width:640px){.icon-btn .lbl{display:none}}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center;margin-bottom:clamp(48px,8vw,90px)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,7vw,5.4rem);line-height:.95;letter-spacing:-.035em;margin-bottom:22px}
.hero h1 .stack{display:block}
.hero h1 .fill{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--muted);max-width:46ch;margin-bottom:28px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{height:54px;padding:0 24px;border-radius:18px;font-family:var(--display);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-ghost:hover{transform:translateY(-2px)}

/* Live demo tile */
.demo{position:relative;perspective:1400px;min-height:340px}
.demo-card{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.demo-card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;padding:clamp(24px,4vw,40px);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.face.front{background:var(--surface);border:1px solid var(--line)}
.face.back{background:var(--grad);color:#fff;transform:rotateY(180deg)}
.face .seg-tag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.face.back .seg-tag{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.face .big{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.15;letter-spacing:-.02em}
.face .hint{color:var(--muted);font-weight:700;font-size:.9rem}
.face.back .hint{color:rgba(255,255,255,.85)}
.face.back .note{font-size:1.05rem;opacity:.95;max-width:42ch}
.demo-shadow{position:absolute;inset:18px -14px -14px 18px;border-radius:32px;background:var(--bg-2);z-index:-1;border:1px solid var(--line)}

/* Week rotation */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.section-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:-.02em}
.section-head p{color:var(--muted);max-width:52ch}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:clamp(48px,8vw,80px);counter-reset:wk}
@media (max-width:1050px){.weeks{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.week{position:relative;text-align:left;border-radius:26px;padding:22px 20px 20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:10px;min-height:270px;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s}
.week:hover{transform:translateY(-6px) rotate(-.6deg);border-color:var(--orange)}
.week .num{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px var(--orange);opacity:.9}
.week .w-label{font-weight:800;color:var(--muted);font-size:.85rem}
.week .emoji{position:absolute;top:18px;right:18px;font-size:2.2rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.week h3{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;letter-spacing:-.01em}
.week p{color:var(--muted);font-size:.95rem;flex:1}
.week .foot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.9rem}
.week .play{background:var(--grad);color:#fff;border-radius:12px;padding:8px 14px}
.week.current{border:2px solid var(--orange)}
.week.current::after{content:"This week";position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:var(--grad);color:#fff;font-weight:800;font-size:.75rem;padding:4px 12px;border-radius:999px;display:none}
.now-chip{display:none;align-self:flex-start;background:var(--grad);color:#fff;font-weight:800;font-size:.75rem;padding:4px 10px;border-radius:999px}
.week.current .now-chip{display:inline-block}

/* How to film */
.film{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-bottom:28px}
@media (max-width:820px){.film{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.film{grid-template-columns:1fr}}
.film div{padding:24px;border-right:1px solid var(--line)}
.film div:last-child{border-right:0}
@media (max-width:820px){.film div{border-bottom:1px solid var(--line)}}
.film b{display:block;font-family:var(--display);font-size:2rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin-bottom:10px}
.film h4{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-bottom:6px}
.film p{color:var(--muted);font-size:.95rem}
.keys{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--muted);font-size:.9rem;font-weight:600}
kbd{font-family:var(--display);font-weight:700;font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:2px 8px;color:var(--ink)}
.footer-note{margin-top:28px;color:var(--muted);font-size:.9rem}

/* ---------- GAME ---------- */
.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.game-title{display:flex;align-items:center;gap:14px}
.game-title .emoji{width:56px;height:56px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow)}
.game-title h2{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
.game-title small{color:var(--muted);font-weight:700}
.game-tools{display:flex;gap:8px;flex-wrap:wrap}
select.icon-btn{appearance:none;-webkit-appearance:none;padding:0 14px;cursor:pointer}

.progress{display:flex;gap:4px;margin-bottom:22px}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.progress span.done{background:var(--gold)}
.progress span.here{background:var(--orange)}

.stage{position:relative;border-radius:36px;padding:3px;background:var(--grad);box-shadow:var(--shadow)}
.stage-inner{border-radius:33px;background:var(--surface);padding:clamp(22px,5vw,56px);min-height:min(62vh,560px);display:flex;flex-direction:column;gap:clamp(18px,3vw,30px);position:relative;overflow:hidden}
.stage-inner.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.counter{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--muted)}
.counter b{color:var(--ink);font-size:1.4rem}
.prompt-label{font-weight:800;color:var(--orange);font-size:1rem}
.question{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.6vw,3.4rem);line-height:1.12;letter-spacing:-.025em;max-width:24ch}
.question.quote::before{content:"\201C";color:var(--gold)}
.question.quote::after{content:"\201D";color:var(--gold)}
.question.emoji-q{font-size:clamp(3.6rem,11vw,7.5rem);letter-spacing:.06em;line-height:1.1;max-width:none;text-align:center;margin:auto 0}
.question .trail{color:var(--muted)}
.blank{display:inline-block;min-width:4ch;border-bottom:4px dashed var(--gold);margin-left:.2em}

.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{position:relative;min-height:72px;padding:16px 20px;border-radius:20px;background:var(--surface-2);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:clamp(1rem,2vw,1.25rem);text-align:left;display:flex;align-items:center;gap:14px;transition:transform .15s,border-color .15s,background .25s,color .25s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--gold)}
.opt .key{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:.9rem;background:var(--surface);border:1px solid var(--line)}
.opt.locked{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--surface-2))}
.opt.locked .key{background:var(--orange);color:#fff;border-color:transparent}
.opt.correct{background:var(--good);border-color:var(--good);color:#fff;animation:pop .45s}
.opt.correct .key{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .key{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}
.opt.dim{opacity:.45}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

.answer{border-radius:24px;padding:clamp(18px,3vw,28px);background:var(--grad);color:#fff;display:none;gap:8px;flex-direction:column;transform-origin:top center}
.answer.show{display:flex;animation:reveal .55s cubic-bezier(.2,.9,.25,1.2)}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.answer .a-label{font-weight:800;opacity:.85}
.answer .a-main{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2.3rem);line-height:1.15;letter-spacing:-.02em}
.answer .a-note{font-size:clamp(1rem,1.6vw,1.15rem);max-width:60ch}
.ref{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:999px;font-weight:800}

.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.controls .mid{display:flex;align-items:center;gap:12px}
.btn-reveal{height:64px;padding:0 34px;font-size:1.15rem;border-radius:22px}
.btn-reveal[disabled]{opacity:.5;cursor:default;transform:none}

/* Timer ring */
.timer{position:relative;width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.timer svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .track{stroke:var(--line)}
.timer .bar{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer.done{background:var(--bad);color:#fff;animation:pulse .8s infinite}
.timer.done .track{stroke:rgba(255,255,255,.3)}
@keyframes pulse{50%{transform:scale(1.08)}}
.timer .t-num{position:relative}

/* Finish screen */
.finish{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:inherit;flex:1}
.finish .big-emoji{font-size:5rem}
.finish h3{font-family:var(--display);font-weight:900;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.03em;line-height:1}
.finish p{color:var(--muted);max-width:44ch}

/* Scoreboard drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--surface);border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer.open{transform:none}
.drawer h3{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:4px}
.drawer .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row input{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:inherit;font-weight:600}
.players{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.player{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.player.lead{border-color:var(--gold)}
.player .p-name{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .p-score{font-family:var(--display);font-weight:900;font-size:1.5rem;min-width:2ch;text-align:center}
.player button{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:1.1rem}
.player button.plus{background:var(--grad);color:#fff;border:0}
.player .crown{font-size:1.1rem}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:2px dashed var(--line);border-radius:18px}
.drawer-foot{display:flex;gap:8px;margin-top:14px}
.drawer-foot .icon-btn{flex:1}
.scrim{position:fixed;inset:0;background:rgba(20,10,0,.35);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 80px));visibility:hidden;background:var(--ink);color:var(--bg);font-weight:700;padding:12px 20px;border-radius:14px;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0);visibility:visible}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:640px){
  .controls{justify-content:center}
  .controls .nav-btn .lbl{display:none}
  .btn-reveal{padding:0 24px}
}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>
<div class="wave" aria-hidden="true">
  <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
    <defs>
      <linearGradient id="wg" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#F7B733"/><stop offset=".5" stop-color="#F08A24"/><stop offset="1" stop-color="#DF5B14"/>
      </linearGradient>
    </defs>
    <path fill="url(#wg)" opacity=".22" d="M0,190 C240,120 420,260 720,200 C1010,140 1200,90 1440,150 L1440,320 L0,320 Z"/>
    <path fill="url(#wg)" opacity=".5" d="M0,240 C260,190 470,300 760,250 C1040,200 1230,220 1440,200 L1440,320 L0,320 Z"/>
    <path fill="url(#wg)" d="M0,285 C300,250 520,320 820,285 C1080,255 1260,275 1440,262 L1440,320 L0,320 Z"/>
  </svg>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#F7B733"/><stop offset="1" stop-color="#DF5B14"/></linearGradient></defs>
</svg>

<div class="app">
  <header class="topbar">
    <a href="#/" class="brand" style="text-decoration:none;color:inherit" aria-label="Home">
      <span class="brand-mark">R</span>
      <span>REACH Summerstrand<small>Pre-Bible Study Games</small></span>
    </a>
    <div class="tools">
      <button class="icon-btn" id="scoresBtn" title="Scoreboard (S)">🏆<span class="lbl">Scores</span></button>
      <button class="icon-btn" id="soundBtn" title="Timer sound on or off" aria-label="Timer sound on">🔔</button>
      <button class="icon-btn" id="themeBtn" title="Switch light or dark">🌗</button>
      <button class="icon-btn" id="fsBtn" title="Full screen (F)">⛶<span class="lbl">Full screen</span></button>
    </div>
  </header>

  <main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Scoreboard">
  <h3>Scoreboard</h3>
  <p class="sub">Add tonight's players and tap + when they get one right.</p>
  <div class="add-row">
    <input id="playerName" placeholder="Player name" maxlength="24" aria-label="Player name">

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

// Shuffle "Who said it" options once so the right answer isn't always first
SEGMENTS.forEach(s => { if (s.type === "who") s.items.forEach(it => it.opts = shuffle(it.options)); });

const state = {
  seg: null, order: [], idx: 0, revealed: false, locked: null, shuffled: false,
  timerLen: 15, timerLeft: 0, timerId: null, sound: true, players: [], finished: false
};

// Rotation: which week of the 5-week cycle are we in? Starts counting from 5 Jan 2026 (a Monday).
function currentWeek() {
  const start = new Date(2026, 0, 5);
  const weeks = Math.floor((Date.now() - start) / (7 * 864e5));
  return ((weeks % 5) + 5) % 5 + 1;
}

/* ---------- Routing ---------- */
function route() {
  stopTimer();
  const m = location.hash.match(/^#\/play\/([\w-]+)/);
  const seg = m && SEGMENTS.find(s => s.id === m[1]);
  if (seg) startGame(seg); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Home ---------- */

function randomDemo() {
  const s = SEGMENTS[Math.floor(Math.random() * SEGMENTS.length)];
  const it = s.items[Math.floor(Math.random() * s.items.length)];
  let q, a, note = it.note || "";
  if (s.type === "finish") { q = it.start + " …"; a = "…" + it.end; }
  else if (s.type === "emoji") { q = it.q; a = it.a; }
  else { q = "“" + it.q + "”"; a = it.a; }
  if (it.ref) note = (note ? note + " " : "") + "(" + it.ref + ")";
  return { s, q, a, note };
}
function setupDemo() {
  const card = $("#demoCard");
  const fill = () => {
    const d = randomDemo();
    $("#dTag").textContent = d.s.emoji + " " + d.s.title;
    $("#dTag2").textContent = d.s.emoji + " " + d.s.title;
    $("#dQ").textContent = d.q;
    $("#dQ").style.fontSize = d.s.type === "emoji" ? "clamp(3rem,8vw,5rem)" : "";
    $("#dA").textContent = d.a;
    $("#dNote").textContent = d.note;
  };
  fill();
  const flip = () => {
    if (card.classList.contains("flipped")) {
      card.classList.remove("flipped");
      setTimeout(fill, 400);
    } else {
      card.classList.add("flipped");
    }
  };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
}

/* ---------- Game ---------- */
function startGame(seg) {

          ${[10, 15, 20, 30].map(n => `<option value="${n}" ${n === state.timerLen ? "selected" : ""}>⏱ ${n}s</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="progress" id="progress">${seg.items.map(() => "<span></span>").join("")}</div>
    <div class="stage"><div class="stage-inner" id="stage"></div></div>

      <div class="mid">
        <button class="timer" id="timerBtn" title="Start timer (T)" aria-label="Start timer">
          <svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="24"/><circle class="bar" id="timerBar" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg>
          <span class="t-num" id="timerNum">${state.timerLen}</span>
        </button>
        <button class="btn btn-primary btn-reveal" id="revealBtn">Reveal answer</button>
      </div>
      <button class="btn btn-ghost nav-btn" id="nextBtn"><span class="lbl">Next</span> →</button>
    </div>
  `;
  $("#prevBtn").onclick = prev;
  $("#nextBtn").onclick = next;
  $("#revealBtn").onclick = reveal;
  $("#timerBtn").onclick = toggleTimer;
  $("#timerSel").onchange = e => { state.timerLen = +e.target.value; resetTimer(); };
  $("#shuffleBtn").onclick = e => {
    state.shuffled = !state.shuffled;
    e.currentTarget.setAttribute("aria-pressed", state.shuffled);
    const cur = state.order[state.idx];
    state.order = state.shuffled ? shuffle(seg.items.map((_, i) => i)) : seg.items.map((_, i) => i);
    // keep the current question on screen, start the new order from it
    state.order.splice(state.order.indexOf(cur), 1);
    state.order.unshift(cur);
    state.idx = 0;
    renderQuestion();
    toast(state.shuffled ? "Questions shuffled" : "Questions back in order");
  };
  renderQuestion();
}

function renderQuestion() {
  const seg = state.seg;
  const it = seg.items[state.order[state.idx]];
  state.revealed = false;
  state.locked = null;
  state.finished = false;
  resetTimer();

  let body = "";
  if (seg.type === "choice" || seg.type === "who") {
    const opts = seg.type === "who" ? it.opts : seg.options;
    body = `
      <div class="question quote">${esc(it.q)}</div>
      <div class="options">
        ${opts.map((o, i) => `<button class="opt" data-opt="${esc(o)}"><span class="key">${i + 1}</span>${esc(o)}</button>`).join("")}
      </div>`;
  } else if (seg.type === "finish") {
    body = `<div class="question">${esc(it.start)} <span class="blank" aria-label="blank"></span></div>`;
  } else {
    body = `<div class="question emoji-q" aria-label="Emoji clue">${it.q}</div>`;
  }

  const answerMain = seg.type === "finish" ? "…" + it.end : it.a;
  $("#stage").innerHTML = `
    <div class="q-top">
      <span class="prompt-label">${esc(seg.prompt)}</span>
      <span class="counter"><b>${state.idx + 1}</b> / ${seg.items.length}</span>
    </div>
    ${body}
    <div class="answer" id="answer" aria-live="polite">
      <span class="a-label">Answer</span>
      <div class="a-main">${esc(answerMain)}</div>
      ${it.note ? `<div class="a-note">${esc(it.note)}</div>` : ""}
      ${it.ref ? `<span class="ref">📖 ${esc(it.ref)}</span>` : ""}
    </div>
  `;
  $("#stage").classList.remove("shake");

  $("#stage").querySelectorAll(".opt").forEach(b => b.onclick = () => lockIn(b.dataset.opt));

  const bars = $("#progress").children;
  [...bars].forEach((b, i) => { b.className = i < state.idx ? "done" : i === state.idx ? "here" : ""; });

  $("#revealBtn").disabled = false;
  $("#revealBtn").textContent = "Reveal answer";
  $("#prevBtn").disabled = state.idx === 0;
  $("#prevBtn").style.opacity = state.idx === 0 ? .45 : 1;
  $("#nextBtn").querySelector(".lbl").textContent = state.idx === seg.items.length - 1 ? "Finish" : "Next";
  $("#controls").style.display = "";
}

function lockIn(opt) {
  if (state.revealed) return;
  state.locked = state.locked === opt ? null : opt;
  $("#stage").querySelectorAll(".opt").forEach(b => b.classList.toggle("locked", b.dataset.opt === state.locked));
}

function reveal() {
  if (state.revealed || state.finished) return;
  state.revealed = true;
  stopTimer();
  const seg = state.seg;
  const it = seg.items[state.order[state.idx]];
  if (seg.type === "choice" || seg.type === "who") {
    $("#stage").querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      b.classList.remove("locked");
      const o = b.dataset.opt;
      if (o === it.a) b.classList.add("correct");
      else if (o === state.locked) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    if (state.locked === it.a) confetti(160);
    else if (state.locked) { $("#stage").classList.add("shake"); }
  } else {
    confetti(90);
  }
  $("#answer").classList.add("show");
  $("#revealBtn").disabled = true;
  $("#revealBtn").textContent = "Answer revealed";
}

function next() {
  if (state.finished) return;
  if (state.idx < state.seg.items.length - 1) { state.idx++; renderQuestion(); }
  else finish();
}
function prev() {
  if (state.finished) { state.finished = false; renderQuestion(); return; }
  if (state.idx > 0) { state.idx--; renderQuestion(); }
}

function finish() {
  state.finished = true;
  stopTimer();
  const seg = state.seg;
  const nextSeg = SEGMENTS[seg.week % 5];
  [...$("#progress").children].forEach(b => b.className = "done");
  $("#stage").innerHTML = `
    <div class="finish">
      <div class="big-emoji">🎉</div>
      <h3>That's a wrap!</h3>
      <p>You've been through all ${seg.items.length} ${esc(seg.title)} questions. Next week is ${esc(nextSeg.title)}.</p>
      <div class="cta-row" style="justify-content:center">
        <button class="btn btn-primary" id="again">Play again</button>
        <a class="btn btn-ghost" href="#/play/${nextSeg.id}" style="text-decoration:none;color:inherit">Try ${esc(nextSeg.title)}</a>
      </div>
    </div>`;
  $("#controls").style.display = "none";
  $("#again").onclick = () => startGame(seg);
  confetti(220);
}

/* ---------- Timer ---------- */
const CIRC = 150.8;
function resetTimer() {
  stopTimer();
  state.timerLeft = state.timerLen;
  const btn = $("#timerBtn"); if (!btn) return;
  btn.classList.remove("done");
  $("#timerNum").textContent = state.timerLen;
  $("#timerBar").style.strokeDashoffset = 0;
}
function stopTimer() { clearInterval(state.timerId); state.timerId = null; }
function toggleTimer() {
  if (!state.seg || state.revealed || state.finished) return;
  if (state.timerId) { stopTimer(); return; }
  if (state.timerLeft <= 0) resetTimer();
  const end = Date.now() + state.timerLeft * 1000;
  state.timerId = setInterval(() => {
    state.timerLeft = Math.max(0, (end - Date.now()) / 1000);
    $("#timerNum").textContent = Math.ceil(state.timerLeft);
    $("#timerBar").style.strokeDashoffset = CIRC * (1 - state.timerLeft / state.timerLen);
    if (state.timerLeft <= 3 && state.timerLeft > 0 && Math.abs(state.timerLeft - Math.round(state.timerLeft)) < .05) beep(660, .08);
    if (state.timerLeft <= 0) {
      stopTimer();
      $("#timerBtn").classList.add("done");
      $("#timerNum").textContent = "0";
      beep(330, .5);
      $("#stage").classList.remove("shake"); void $("#stage").offsetWidth; $("#stage").classList.add("shake");
      toast("⏰ Time's up!");
    }
  }, 50);
}
let actx;
let lastBeep = 0;
function beep(freq, dur) {
  if (!state.sound) return;
  const now = Date.now(); if (now - lastBeep < 200 && dur < .2) return; lastBeep = now;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(.25, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* ---------- Scoreboard ---------- */
function renderPlayers() {
  const list = $("#players");
  if (!state.players.length) { list.innerHTML = `<div class="empty">No players yet. Add the people sitting in front of the camera.</div>`; return; }
  const top = Math.max(...state.players.map(p => p.score));
  list.innerHTML = state.players.map((p, i) => `
    <div class="player ${p.score === top && top > 0 ? "lead" : ""}">
      ${p.score === top && top > 0 ? '<span class="crown">👑</span>' : ""}
      <span class="p-name">${esc(p.name)}</span>
      <button data-i="${i}" data-d="-1" aria-label="Take a point from ${esc(p.name)}">−</button>
      <span class="p-score">${p.score}</span>
      <button class="plus" data-i="${i}" data-d="1" aria-label="Give ${esc(p.name)} a point">+</button>
      <button data-i="${i}" data-x="1" aria-label="Remove ${esc(p.name)}" title="Remove">✕</button>
    </div>`).join("");
  list.querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (b.dataset.x) state.players.splice(i, 1);
    else { state.players[i].score = Math.max(0, state.players[i].score + +b.dataset.d); if (+b.dataset.d > 0) confetti(40); }
    renderPlayers();
  });
}
function addPlayer() {
  const inp = $("#playerName"); const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  state.players.push({ name, score: 0 }); inp.value = ""; inp.focus(); renderPlayers();
}
function openDrawer(open) {
  $("#drawer").classList.toggle("open", open);
  $("#scrim").classList.toggle("show", open);
  if (open) setTimeout(() => $("#playerName").focus(), 300);
}
$("#addPlayer").onclick = addPlayer;
$("#playerName").onkeydown = e => { if (e.key === "Enter") addPlayer(); };
$("#scoresBtn").onclick = () => openDrawer(!$("#drawer").classList.contains("open"));
$("#closeDrawer").onclick = () => openDrawer(false);
$("#scrim").onclick = () => openDrawer(false);
$("#resetScores").onclick = () => { state.players.forEach(p => p.score = 0); renderPlayers(); toast("Scores reset"); };

/* ---------- Top tools ---------- */
$("#soundBtn").onclick = e => {
  state.sound = !state.sound;
  e.currentTarget.setAttribute("aria-label", state.sound ? "Timer sound on" : "Timer sound off");
  e.currentTarget.textContent = state.sound ? "🔔" : "🔕";
  toast(state.sound ? "Timer sound on" : "Timer sound off");
};
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => toast("Full screen isn't available here"));
  else document.exitFullscreen?.();
}
$("#fsBtn").onclick = toggleFS;

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "s") { openDrawer(!$("#drawer").classList.contains("open")); return; }
  if (k === "f") { toggleFS(); return; }
  if (k === "escape") { if ($("#drawer").classList.contains("open")) openDrawer(false); else if (state.seg) location.hash = "#/"; return; }
  if (!state.seg) return;
  if (k === " " || k === "enter") { if (e.target.tagName === "BUTTON" && k === "enter") return; e.preventDefault(); reveal(); }
  else if (k === "arrowright") next();
  else if (k === "arrowleft") prev();
  else if (k === "t") toggleTimer();
  else if (/^[1-4]$/.test(k)) {
    const b = $("#stage").querySelectorAll(".opt")[+k - 1];
    if (b) lockIn(b.dataset.opt);
  }
});

/* ---------- Toast ---------- */
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- Confetti ---------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function sizeCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confetti(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#F7B733", "#F08A24", "#DF5B14", "#FFE4B5", "#FFFFFF", "#FFD166"];
  for (let i = 0; i < n; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .4,
      y: innerHeight * .45,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35,
      c: colors[Math.floor(Math.random() * colors.length)], life: 0
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => {
    p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, 1 - p.life / 160);
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * .1)));
    cx.restore();
  });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 160);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
}

/* ---------- Go ---------- */
renderPlayers();
route();
</script>
</body>
</html>
