<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REACH Bible Study Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EA;
  --bg-2:#F4E7D0;
  --surface:#FFFFFF;
  --surface-2:#FFF8EE;
  --ink:#2B1D10;
  --muted:#7C6650;
  --line:rgba(43,29,16,.12);
  --orange:#EE7A1E;
  --gold:#F5B335;
  --ember:#C9500F;
  --good:#1F9A57;
  --bad:#D23F3F;
  --grad:linear-gradient(120deg,#F7B733 0%,#F08A24 45%,#DF5B14 100%);
  --wave-op:1;
  --shadow:0 18px 50px -20px rgba(160,80,10,.35);
  --card-shadow:0 2px 0 rgba(43,29,16,.06),0 20px 40px -24px rgba(120,60,10,.35);
  --display:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Mulish',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100A;--bg-2:#22180F;--surface:#221911;--surface-2:#2B2016;
    --ink:#FCF1E2;--muted:#C2A98C;--line:rgba(255,230,200,.12);
    --good:#3CCB7F;--bad:#FF6464;--wave-op:.75;
    --shadow:0 18px 60px -20px rgba(0,0,0,.7);
    --card-shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16100A;--bg-2:#22180F;--surface:#221911;--surface-2:#2B2016;
  --ink:#FCF1E2;--muted:#C2A98C;--line:rgba(255,230,200,.12);
  --good:#3CCB7F;--bad:#FF6464;--wave-op:.75;
  --shadow:0 18px 60px -20px rgba(0,0,0,.7);
  --card-shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body);background:var(--bg);color:var(--ink);
  line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}

/* Brand wave */
.wave{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:200px;pointer-events:none;z-index:0;opacity:var(--wave-op)}
.wave svg{width:100%;height:100%;display:block}
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0;background:radial-gradient(circle,#F7B733,transparent 65%);top:-30vmax;right:-20vmax}

.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 120px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(24px,5vw,48px)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1rem}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:var(--shadow)}
.brand small{display:block;font-family:var(--body);font-weight:600;color:var(--muted);font-size:.8rem;margin-top:-2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{height:42px;min-width:42px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9rem;transition:transform .15s,background .15s}
.icon-btn:hover{transform:translateY(-1px);background:var(--surface-2)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn .lbl{display:inline}
@media (max-width:640px){.icon-btn .lbl{display:none}}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center;margin-bottom:clamp(48px,8vw,90px)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,7vw,5.4rem);line-height:.95;letter-spacing:-.035em;margin-bottom:22px}
.hero h1 .stack{display:block}
.hero h1 .fill{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--muted);max-width:46ch;margin-bottom:28px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{height:54px;padding:0 24px;border-radius:18px;font-family:var(--display);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-ghost:hover{transform:translateY(-2px)}

/* Live demo tile */
.demo{position:relative;perspective:1400px;min-height:340px}
.demo-card{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.demo-card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;padding:clamp(24px,4vw,40px);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.face.front{background:var(--surface);border:1px solid var(--line)}
.face.back{background:var(--grad);color:#fff;transform:rotateY(180deg)}
.face .seg-tag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.face.back .seg-tag{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.face .big{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.15;letter-spacing:-.02em}
.face .hint{color:var(--muted);font-weight:700;font-size:.9rem}
.face.back .hint{color:rgba(255,255,255,.85)}
.face.back .note{font-size:1.05rem;opacity:.95;max-width:42ch}
.demo-shadow{position:absolute;inset:18px -14px -14px 18px;border-radius:32px;background:var(--bg-2);z-index:-1;border:1px solid var(--line)}

/* Week rotation */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.section-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:-.02em}
.section-head p{color:var(--muted);max-width:52ch}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:clamp(48px,8vw,80px);counter-reset:wk}
@media (max-width:1050px){.weeks{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.week{position:relative;text-align:left;border-radius:26px;padding:22px 20px 20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:10px;min-height:270px;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s}
.week:hover{transform:translateY(-6px) rotate(-.6deg);border-color:var(--orange)}
.week .num{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px var(--orange);opacity:.9}
.week .w-label{font-weight:800;color:var(--muted);font-size:.85rem}
.week .emoji{position:absolute;top:18px;right:18px;font-size:2.2rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.week h3{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15;letter-spacing:-.01em}
.week p{color:var(--muted);font-size:.95rem;flex:1}
.week .foot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.9rem}
.week .play{background:var(--grad);color:#fff;border-radius:12px;padding:8px 14px}
.week.current{border:2px solid var(--orange)}
.week.current::after{content:"This week";position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:var(--grad);color:#fff;font-weight:800;font-size:.75rem;padding:4px 12px;border-radius:999px;display:none}
.now-chip{display:none;align-self:flex-start;background:var(--grad);color:#fff;font-weight:800;font-size:.75rem;padding:4px 10px;border-radius:999px}
.week.current .now-chip{display:inline-block}

/* How to film */
.film{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-bottom:28px}
@media (max-width:820px){.film{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.film{grid-template-columns:1fr}}
.film div{padding:24px;border-right:1px solid var(--line)}
.film div:last-child{border-right:0}
@media (max-width:820px){.film div{border-bottom:1px solid var(--line)}}
.film b{display:block;font-family:var(--display);font-size:2rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin-bottom:10px}
.film h4{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-bottom:6px}
.film p{color:var(--muted);font-size:.95rem}
.keys{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--muted);font-size:.9rem;font-weight:600}
kbd{font-family:var(--display);font-weight:700;font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:2px 8px;color:var(--ink)}
.footer-note{margin-top:28px;color:var(--muted);font-size:.9rem}

/* ---------- GAME ---------- */
.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.game-title{display:flex;align-items:center;gap:14px}
.game-title .emoji{width:56px;height:56px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow)}
.game-title h2{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:-.02em;line-height:1.1}
.game-title small{color:var(--muted);font-weight:700}
.game-tools{display:flex;gap:8px;flex-wrap:wrap}
select.icon-btn{appearance:none;-webkit-appearance:none;padding:0 14px;cursor:pointer}

.progress{display:flex;gap:4px;margin-bottom:22px}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.progress span.done{background:var(--gold)}
.progress span.here{background:var(--orange)}

.stage{position:relative;border-radius:36px;padding:3px;background:var(--grad);box-shadow:var(--shadow)}
.stage-inner{border-radius:33px;background:var(--surface);padding:clamp(22px,5vw,56px);min-height:min(62vh,560px);display:flex;flex-direction:column;gap:clamp(18px,3vw,30px);position:relative;overflow:hidden}
.stage-inner.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.counter{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--muted)}
.counter b{color:var(--ink);font-size:1.4rem}
.prompt-label{font-weight:800;color:var(--orange);font-size:1rem}
.question{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.6vw,3.4rem);line-height:1.12;letter-spacing:-.025em;max-width:24ch}
.question.quote::before{content:"\201C";color:var(--gold)}
.question.quote::after{content:"\201D";color:var(--gold)}
.question.emoji-q{font-size:clamp(3.6rem,11vw,7.5rem);letter-spacing:.06em;line-height:1.1;max-width:none;text-align:center;margin:auto 0}
.question .trail{color:var(--muted)}
.blank{display:inline-block;min-width:4ch;border-bottom:4px dashed var(--gold);margin-left:.2em}

.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{position:relative;min-height:72px;padding:16px 20px;border-radius:20px;background:var(--surface-2);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:clamp(1rem,2vw,1.25rem);text-align:left;display:flex;align-items:center;gap:14px;transition:transform .15s,border-color .15s,background .25s,color .25s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--gold)}
.opt .key{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:.9rem;background:var(--surface);border:1px solid var(--line)}
.opt.locked{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--surface-2))}
.opt.locked .key{background:var(--orange);color:#fff;border-color:transparent}
.opt.correct{background:var(--good);border-color:var(--good);color:#fff;animation:pop .45s}
.opt.correct .key{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .key{background:rgba(255,255,255,.25);color:#fff;border-color:transparent}
.opt.dim{opacity:.45}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

.answer{border-radius:24px;padding:clamp(18px,3vw,28px);background:var(--grad);color:#fff;display:none;gap:8px;flex-direction:column;transform-origin:top center}
.answer.show{display:flex;animation:reveal .55s cubic-bezier(.2,.9,.25,1.2)}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.answer .a-label{font-weight:800;opacity:.85}
.answer .a-main{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2.3rem);line-height:1.15;letter-spacing:-.02em}
.answer .a-note{font-size:clamp(1rem,1.6vw,1.15rem);max-width:60ch}
.ref{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:999px;font-weight:800}

.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.controls .mid{display:flex;align-items:center;gap:12px}
.btn-reveal{height:64px;padding:0 34px;font-size:1.15rem;border-radius:22px}
.btn-reveal[disabled]{opacity:.5;cursor:default;transform:none}

/* Timer ring */
.timer{position:relative;width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.timer svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .track{stroke:var(--line)}
.timer .bar{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer.done{background:var(--bad);color:#fff;animation:pulse .8s infinite}
.timer.done .track{stroke:rgba(255,255,255,.3)}
@keyframes pulse{50%{transform:scale(1.08)}}
.timer .t-num{position:relative}

/* Finish screen */
.finish{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:inherit;flex:1}
.finish .big-emoji{font-size:5rem}
.finish h3{font-family:var(--display);font-weight:900;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.03em;line-height:1}
.finish p{color:var(--muted);max-width:44ch}

/* Scoreboard drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--surface);border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer.open{transform:none}
.drawer h3{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:4px}
.drawer .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row input{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:inherit;font-weight:600}
.players{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.player{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.player.lead{border-color:var(--gold)}
.player .p-name{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .p-score{font-family:var(--display);font-weight:900;font-size:1.5rem;min-width:2ch;text-align:center}
.player button{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:1.1rem}
.player button.plus{background:var(--grad);color:#fff;border:0}
.player .crown{font-size:1.1rem}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:2px dashed var(--line);border-radius:18px}
.drawer-foot{display:flex;gap:8px;margin-top:14px}
.drawer-foot .icon-btn{flex:1}
.scrim{position:fixed;inset:0;background:rgba(20,10,0,.35);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 80px));visibility:hidden;background:var(--ink);color:var(--bg);font-weight:700;padding:12px 20px;border-radius:14px;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0);visibility:visible}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}


/* ---------- Game-show modes ---------- */
.muted{color:var(--muted)}
.txt{flex:1;min-width:180px;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 18px;font:inherit;font-weight:700;font-size:1.05rem}
.txt:focus{border-color:var(--orange);outline:none}
.guess-row{display:flex;gap:10px;flex-wrap:wrap}
.row-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.host-key{border-radius:16px;border:1px dashed var(--line);padding:12px 16px;color:var(--muted);font-size:.95rem}
.host-key summary{cursor:pointer;font-weight:800;color:var(--ink)}
.host-key ol{margin:10px 0 6px 22px}
.host-key p{margin-top:6px}

.feud-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-bottom:18px}
.feud-teams>*{min-width:0}
.txt{min-width:0}
.team{border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--card-shadow)}
.team input{flex:1;min-width:0;background:transparent;border:0;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--ink)}
.team input:focus{outline:none;text-decoration:underline;text-decoration-color:var(--gold)}
.team.b{flex-direction:row-reverse}
.team.b input{text-align:right}
.team .t-score{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1}
.team .t-score.bump{animation:pop .5s}
.bank{border-radius:22px;background:var(--grad);color:#fff;padding:10px 26px;text-align:center;font-family:var(--display);box-shadow:var(--shadow)}
.bank small{display:block;font-family:var(--body);font-weight:700;opacity:.9}
.bank b{font-size:2.2rem;font-weight:900;line-height:1}
@media (max-width:640px){.feud-teams{grid-template-columns:1fr 1fr}.bank{grid-column:1/-1;order:-1}}

.board{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:10px}
@media (max-width:640px){.board{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none!important}}
.slot{display:block;width:100%;height:64px;perspective:900px;padding:0}
.slot-inner{position:relative;display:block;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.slot.open .slot-inner{transform:rotateX(180deg)}
.slot-face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;padding:0 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--display);font-weight:800}
.slot-front{background:var(--surface-2);border:2px solid var(--line);justify-content:center}
.slot-front .n{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.slot-back{background:var(--grad);color:#fff;transform:rotateX(180deg);justify-content:space-between;gap:10px;font-size:clamp(1rem,2vw,1.25rem);text-align:left}
.slot-back .pts{background:rgba(255,255,255,.25);border-radius:10px;padding:4px 10px;min-width:50px;text-align:center}
.slot.missed .slot-back{background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.slot.missed .pts{background:var(--line)}
.strikes{display:flex;gap:8px}
.strike{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:1.4rem;color:var(--line);transition:all .2s}
.strike.on{background:var(--bad);border-color:var(--bad);color:#fff}
.big-x{position:fixed;inset:0;display:grid;place-items:center;z-index:45;pointer-events:none}
.big-x span{font-family:var(--display);font-weight:900;color:var(--bad);line-height:1;-webkit-text-stroke:6px #fff;paint-order:stroke fill;letter-spacing:.05em;animation:xpop 1s forwards;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}
@keyframes xpop{0%{transform:scale(.3);opacity:0}18%{transform:scale(1.1);opacity:1}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}

.ten-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:900px){.ten-wrap{grid-template-columns:1fr}}
.ten-left{display:flex;flex-direction:column;gap:18px}
.ten-stats{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lives{display:flex;gap:6px;font-size:1.8rem}
.life{transition:filter .3s,opacity .3s,transform .3s}
.life.lost{filter:grayscale(1);opacity:.25;transform:scale(.85)}
.ten-score{font-family:var(--display);font-weight:800;color:var(--muted);font-size:1.1rem}

.tower{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;align-items:center;gap:12px;width:100%;height:50px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);padding:0 14px 0 6px;font-family:var(--display);font-weight:800;font-size:clamp(.95rem,1.8vw,1.15rem);text-align:left;transition:background .3s,color .3s}
.rung .rn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:.95rem;flex:none}
.rung .rx{margin-left:auto;font-size:.85rem;opacity:.9;white-space:nowrap}
.rung.hit{background:var(--grad);color:#fff;border-color:transparent;animation:pop .45s}
.rung.hit .rn{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}
.rung.shown{color:var(--muted);border-style:dashed}
.ten-banner{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.fm{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(18px,3vw,36px);align-items:start}

.fm-tabs{display:flex;gap:8px;flex-wrap:wrap}

.chip.nomatch{border-style:dashed;color:var(--muted)}
.chip.taken{opacity:.45;text-decoration:line-through}

.fm-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--display);font-weight:800;margin-bottom:8px;padding:0 4px}
.fm-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fm-cell{height:52px;border-radius:12px;background:rgba(40,15,0,.22);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 14px;font-family:var(--display);font-weight:700;font-size:.95rem;min-width:0}

.fm-cell .p{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;min-width:40px;text-align:center;font-weight:900;flex:none}

.fm-cell.covered{background:rgba(40,15,0,.45)}

.fm-cell.active{box-shadow:inset 0 0 0 3px #fff}
.fm-cell.pop .p{animation:pop .45s}
.fm-total{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.22);font-family:var(--display);font-weight:900;font-size:1.7rem;margin-top:4px}
.fm-meter{height:12px;border-radius:99px;background:rgba(40,15,0,.25);overflow:hidden;margin-top:12px}
.fm-meter span{display:block;height:100%;background:#fff;transition:width .6s}
.fm-goal{text-align:right;font-weight:800;opacity:.9;margin-top:6px;font-size:.9rem}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

// Shuffle "Who said it" options once so the right answer isn't always first
SEGMENTS.forEach(s => { if (s.type === "who") s.items.forEach(it => it.opts = shuffle(it.options)); });

const state = {
  seg: null, order: [], idx: 0, revealed: false, locked: null, shuffled: false,
  timerLen: 15, timerLeft: 0, timerId: null, sound: true, players: [], finished: false
};

// Rotation: which week of the 5-week cycle are we in? Starts counting from 5 Jan 2026 (a Monday).
function currentWeek() {
  const start = new Date(2026, 0, 5);
  const weeks = Math.floor((Date.now() - start) / (7 * 864e5));
  const n = SEGMENTS.length;
  return ((weeks % n) + n) % n + 1;
}

/* ---------- Routing ---------- */
function route() {
  stopTimer();
  if (typeof fmStop === "function") fmStop();
  const m = location.hash.match(/^#\/play\/([\w-]+)/);
  const seg = m && SEGMENTS.find(s => s.id === m[1]);
  if (seg) startGame(seg); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

function randomDemo() {
  const pool = SEGMENTS.filter(x => ["choice", "who", "finish", "emoji"].includes(x.type));
  const s = pool[Math.floor(Math.random() * pool.length)];
  const it = s.items[Math.floor(Math.random() * s.items.length)];
  let q, a, note = it.note || "";
  if (s.type === "finish") { q = it.start + " …"; a = "…" + it.end; }
  else if (s.type === "emoji") { q = it.q; a = it.a; }
  else { q = "“" + it.q + "”"; a = it.a; }
  if (it.ref) note = (note ? note + " " : "") + "(" + it.ref + ")";
  return { s, q, a, note };
}
function setupDemo() {
  const card = $("#demoCard");
  const fill = () => {
    const d = randomDemo();
    $("#dTag").textContent = d.s.emoji + " " + d.s.title;
    $("#dTag2").textContent = d.s.emoji + " " + d.s.title;
    $("#dQ").textContent = d.q;
    $("#dQ").style.fontSize = d.s.type === "emoji" ? "clamp(3rem,8vw,5rem)" : "";
    $("#dA").textContent = d.a;
    $("#dNote").textContent = d.note;
  };
  fill();
  const flip = () => {
    if (card.classList.contains("flipped")) {
      card.classList.remove("flipped");
      setTimeout(fill, 400);
    } else {
      card.classList.add("flipped");
    }
  };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
}

  if (state.shuffled) state.order = shuffle(state.order);
  state.idx = 0;
  state.finished = false;
  view.innerHTML = `
    <div class="game-head">
      <div class="game-title">

function renderQuestion() {

function lockIn(opt) {

function reveal() {

/* ---------- Timer ---------- */
const CIRC = 150.8;
function resetTimer() {

function stopTimer() { clearInterval(state.timerId); state.timerId = null; }

let actx;

function beep(freq, dur) {

    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);

}

/* ---------- Confetti ---------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function sizeCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confetti(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#F7B733", "#F08A24", "#DF5B14", "#FFE4B5", "#FFFFFF", "#FFD166"];
  for (let i = 0; i < n; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .4,
      y: innerHeight * .45,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35,
      c: colors[Math.floor(Math.random() * colors.length)], life: 0
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => {
    p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, 1 - p.life / 160);
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * .1)));
    cx.restore();
  });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 160);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
}

/* =========================================================
   GAME-SHOW MODES: Church Feud, Tenable, Fast Money
   ========================================================= */
function tone(freq, dur, type = "triangle", vol = .25) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const ding = () => { tone(880, .18); setTimeout(() => tone(1320, .35), 110); };

// Answer matching: forgiving with spelling, case and "first/1st/I" style numbering
function norm(x) {
  return String(x).toLowerCase().trim()
    .replace(/^(first|1st|i)\s+/, "1").replace(/^(second|2nd|ii)\s+/, "2").replace(/^(third|3rd|iii)\s+/, "3")
    .replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function findMatch(input, answers) {
  const n = norm(input); if (n.length < 2) return -1;
  const keys = answers.map(x => [x.a, ...(x.alt || [])].map(norm));
  let i = keys.findIndex(ks => ks.includes(n)); if (i > -1) return i;
  i = keys.findIndex(ks => ks.some(k => !/^\d/.test(k) && !/^\d/.test(n) && k.length >= 5 && lev(n, k) <= (k.length > 7 ? 2 : 1)));
  if (i > -1) return i;
  return keys.findIndex(ks => ks.some(k => k.length >= 4 && n.includes(k)));
}
function showX(count = 1) {

}

function feudFlip(i, counts) {

  const i = findMatch(v, answers);
  if (i === -1) { feudStrike(); toast(`“${v}” isn't on the board`); }

}
function feudAward(t) {
  if (!feud.bank) { toast("No points on the board yet"); return; }
  const T = feud.teams[t];
  T.score += feud.bank;
  toast(`${feud.bank} points to ${T.name}`);
  feud.bank = 0;
  $("#bank").textContent = 0;
  const el = $("#tScore" + t);
  el.textContent = T.score;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  confetti(120);
}
function feudEnd() {
  const [A, B] = feud.teams;
  const msg = A.score === B.score ? "It's a tie!" : `${esc((A.score > B.score ? A : B).name)} win!`;
  setProgress(state.seg.items.length);
  $("#controls").style.display = "none";
  $("#stage").innerHTML = `
    <div class="finish">
      <div class="big-emoji">🏆</div>
      <h3>${msg}</h3>
      <p>${esc(A.name)}: ${A.score} points. ${esc(B.name)}: ${B.score} points.</p>
      <div class="cta-row" style="justify-content:center">
        <button class="btn btn-primary" id="again">New game</button>
        <button class="btn btn-ghost" id="backRound">Back to the last round</button>
      </div>
    </div>`;
  $("#again").onclick = () => { feud.teams.forEach(t => t.score = 0); renderFeud(state.seg); };
  $("#backRound").onclick = () => feudRound();
  confetti(260);
}

/* ---------- Tenable ---------- */
const ten = { idx: 0, hit: [], lives: 3, over: false };

function renderTenable(seg) {
  ten.idx = 0;
  view.innerHTML = gameHead(seg) + `
    <div class="progress" id="progress">${seg.items.map(() => "<span></span>").join("")}</div>
    <div class="stage"><div class="stage-inner" id="stage"></div></div>
    <div class="controls" id="controls">
      <button class="btn btn-ghost nav-btn" id="prevBtn">← <span class="lbl">Back</span></button>
      <button class="btn btn-ghost nav-btn" id="nextBtn"><span class="lbl">Next list</span> →</button>
    </div>`;
  $("#prevBtn").onclick = () => { if (ten.idx > 0) { ten.idx--; tenRound(); } };
  $("#nextBtn").onclick = () => { ten.idx = (ten.idx + 1) % seg.items.length; tenRound(); };
  state.customKeys = (e, k) => {
    if (k === "arrowright") $("#nextBtn").click();
    else if (k === "arrowleft") $("#prevBtn").click();
  };
  tenRound();
}

function tenRound() {
  const seg = state.seg, L = seg.items[ten.idx];
  ten.hit = L.items.map(() => false); ten.lives = 3; ten.over = false;
  $("#stage").innerHTML = `
    <div class="q-top"><span class="prompt-label">Name all ten, in any order</span><span class="counter"><b>${ten.idx + 1}</b> / ${seg.items.length}</span></div>
    <div class="ten-wrap">
      <div class="ten-left">
        <div class="question" style="font-size:clamp(1.7rem,3.8vw,2.8rem)">${esc(L.q)}</div>
        <div class="ten-stats">
          <div class="lives" id="lives" aria-label="Lives left">${[0, 1, 2].map(() => `<span class="life">❤️</span>`).join("")}</div>
          <div class="ten-score" id="tenScore"><b>0</b> / 10</div>
        </div>
        <div class="guess-row">
          <input class="txt" id="guess" placeholder="Type their answer" autocomplete="off" aria-label="Their answer">
          <button class="btn btn-primary" id="checkBtn">Check</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="lifeBtn">💔 Wrong answer</button>
          <button class="btn btn-ghost" id="restBtn">Show the rest</button>
        </div>
        <div id="tenMsg" aria-live="polite"></div>
        <details class="host-key"><summary>Host answer key</summary>
          <ol>${L.items.map(x => `<li>${esc(x.a)}${x.extra ? ` (${esc(x.extra)})` : ""}</li>`).join("")}</ol>
          ${L.ref ? `<p>📖 ${esc(L.ref)}</p>` : ""}
          <p>If the typing doesn't catch a correct answer, tap its spot on the list to reveal it.</p>
        </details>
      </div>
      <div class="tower">
        ${L.items.map((x, i) => `<button class="rung" data-i="${i}" aria-label="Spot ${i + 1}"><span class="rn">${i + 1}</span><span class="rt"></span><span class="rx"></span></button>`).join("")}
      </div>
    </div>`;
  $("#stage").querySelectorAll(".rung").forEach(b => b.onclick = () => tenHit(+b.dataset.i));
  $("#checkBtn").onclick = tenGuess;
  $("#guess").onkeydown = e => { if (e.key === "Enter") tenGuess(); };
  $("#lifeBtn").onclick = tenLife;
  $("#restBtn").onclick = () => tenRest(`They got ${tenCount()} out of 10.`);
  setProgress(ten.idx);
  $("#prevBtn").style.opacity = ten.idx === 0 ? .45 : 1;
}
const tenCount = () => ten.hit.filter(Boolean).length;
function tenFill(i, cls) {
  const x = state.seg.items[ten.idx].items[i], r = $(`.rung[data-i="${i}"]`);
  r.classList.add(cls);
  r.querySelector(".rt").textContent = x.a;
  r.querySelector(".rx").textContent = x.extra || "";
}
function tenHit(i) {
  if (ten.over || ten.hit[i]) return;
  ten.hit[i] = true;
  tenFill(i, "hit");
  ding();
  $("#tenScore").innerHTML = `<b>${tenCount()}</b> / 10`;
  if (tenCount() === 10) {
    ten.over = true;
    $("#tenMsg").innerHTML = `<div class="ten-banner">Tenable!</div>`;
    confetti(300);
  }
}
function tenGuess() {
  const inp = $("#guess"), v = inp.value.trim();
  if (!v || ten.over) { inp.focus(); return; }
  const i = findMatch(v, state.seg.items[ten.idx].items);
  if (i === -1) { toast(`“${v}” isn't on the list`); tenLife(); }
  else if (ten.hit[i]) toast("That one's already on the list");
  else tenHit(i);
  inp.value = ""; inp.focus();
}
function tenLife() {
  if (ten.over || ten.lives <= 0) return;
  ten.lives--;
  [...$("#lives").children].forEach((h, i) => h.classList.toggle("lost", i >= ten.lives));
  showX(1); buzz();
  if (ten.lives === 0) setTimeout(() => tenRest(`Out of lives. They got ${tenCount()} out of 10.`), 900);
}
function tenRest(msg) {
  ten.over = true;
  ten.hit.forEach((h, i) => { if (!h) tenFill(i, "shown"); });
  $("#tenMsg").innerHTML = `<div class="fm-q">${esc(msg)}</div>`;
}

/* ---------- Fast Money ---------- */
const FM_TIME = [20, 25], FM_TARGET = 200;
const fm = { set: 0, phase: "setup", q: 0, ans: [[], []], shown: [[], []], names: ["Player 1", "Player 2"], left: 0, timerId: null, total: 0, busy: false };

function renderFastMoney(seg) {
  fmStop();
  fm.phase = "setup";
  view.innerHTML = gameHead(seg) + `<div class="stage"><div class="stage-inner" id="stage"></div></div>`;
  state.customKeys = (e, k) => {
    if (fm.phase !== "p1" && fm.phase !== "p2") return;
    if (k === "0") fmAnswer(-1);
    else if (/^[1-9]$/.test(k)) fmAnswer(+k - 1);
  };
  fmDraw();
}
function fmReset() {
  fmStop();
  fm.q = 0; fm.total = 0; fm.busy = false;
  fm.ans = [[], []];
  fm.shown = [[false, false, false, false, false], [false, false, false, false, false]];
}
function fmCell(p, r) {
  const a = fm.ans[p][r];
  const covered = p === 0 && (fm.phase === "p2" || fm.phase === "p2done");
  const active = ((fm.phase === "p1" && p === 0) || (fm.phase === "p2" && p === 1)) && r === fm.q;
  const pts = a && fm.shown[p][r] ? a.pts : "";
  return `<div class="fm-cell ${covered ? "covered" : ""} ${active ? "active" : ""}" id="c${p}${r}"><span class="t">${a ? esc(a.a) : ""}</span><span class="p">${pts}</span></div>`;
}
function fmBoard() {
  return `<div class="fm-board">
    <div class="fm-head"><span id="h0">${esc(fm.names[0])}</span><span id="h1">${esc(fm.names[1])}</span></div>
    ${[0, 1, 2, 3, 4].map(r => `<div class="fm-row">${fmCell(0, r)}${fmCell(1, r)}</div>`).join("")}
    <div class="fm-total"><span>Total</span><span id="fmTotal">${fm.total}</span></div>
    <div class="fm-meter"><span style="width:${Math.min(100, fm.total / FM_TARGET * 100)}%"></span></div>
    <div class="fm-goal">Goal: ${FM_TARGET}</div>
  </div>`;
}
function fmDraw() {
  const seg = state.seg, S = seg.items[fm.set], P = fm.phase, N = fm.names;
  let left = "";
  if (P === "setup") {
    left = `
      <span class="prompt-label">${esc(S.name)}</span>
      <div class="fm-q">Two players. Five questions. Reach ${FM_TARGET} points together.</div>
      <p class="muted">${esc(N[0])} gets ${FM_TIME[0]} seconds while ${esc(N[1])} waits out of earshot. Then ${esc(N[1])} gets ${FM_TIME[1]} seconds and can't repeat an answer.</p>
      <div class="guess-row">
        <input class="txt" id="n0" value="${esc(N[0])}" maxlength="18" aria-label="Player 1 name">
        <input class="txt" id="n1" value="${esc(N[1])}" maxlength="18" aria-label="Player 2 name">
      </div>
      <div class="fm-tabs">${seg.items.map((x, i) => `<button class="icon-btn" data-set="${i}" aria-pressed="${i === fm.set}">${esc(x.name)}</button>`).join("")}</div>
      <div><button class="btn btn-primary btn-reveal" id="fmGo">▶ Start ${esc(N[0])}'s turn</button></div>`;
  } else if (P === "p1" || P === "p2") {
    const p = P === "p1" ? 0 : 1, Q = S.qs[fm.q], prior = fm.ans[0][fm.q];
    left = `
      <div class="fm-turn">
        <button class="timer" id="fmTimer" title="Pause or resume" aria-label="Pause or resume timer">
          <svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="24"/><circle class="bar" id="fmBar" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="${CIRC * (1 - fm.left / FM_TIME[p])}"/></svg>
          <span class="t-num" id="fmNum">${Math.ceil(fm.left)}</span>
        </button>
        <div><span class="prompt-label">${esc(N[p])}'s turn</span><div class="counter"><b>${fm.q + 1}</b> / 5</div></div>
      </div>
      <div class="fm-q">${esc(Q.q)}</div>
      <div class="chips">
        ${Q.answers.map((x, i) => `<button class="chip ${p === 1 && prior && prior.i === i ? "taken" : ""}" data-i="${i}"><span class="key">${i + 1}</span>${esc(x.a)}</button>`).join("")}
        <button class="chip nomatch" data-i="-1"><span class="key">0</span>No match</button>
      </div>
      <p class="muted">Tap what they said. If it isn't here, tap No match.</p>`;
  } else if (P === "p1done") {
    left = `<span class="prompt-label">Time's up</span>
      <div class="fm-q">That's ${esc(N[0])} done. Let's see how they scored.</div>
      <div><button class="btn btn-primary btn-reveal" id="fmReveal">Reveal ${esc(N[0])}'s points</button></div>`;
  } else if (P === "p1shown") {
    left = `<span class="prompt-label">${fm.total} points so far</span>
      <div class="fm-q">Bring in ${esc(N[1])}. They need ${Math.max(0, FM_TARGET - fm.total)} more.</div>
      <p class="muted">${esc(N[0])}'s answers get covered while ${esc(N[1])} plays.</p>
      <div><button class="btn btn-primary btn-reveal" id="fmGo">▶ Start ${esc(N[1])}'s turn</button></div>`;
  } else if (P === "p2done") {
    left = `<span class="prompt-label">Time's up</span>
      <div class="fm-q">Moment of truth. Did they make it to ${FM_TARGET}?</div>
      <div><button class="btn btn-primary btn-reveal" id="fmReveal">Reveal ${esc(N[1])}'s points</button></div>`;
  } else if (P === "result") {
    const won = fm.total >= FM_TARGET;
    left = won
      ? `<div class="ten-banner">${fm.total} points!</div><div class="fm-q">They made it past ${FM_TARGET}.</div>`
      : `<div class="fm-q">${fm.total} points. So close!</div><p class="muted">They needed ${FM_TARGET - fm.total} more to hit ${FM_TARGET}.</p>`;
    left += `<div class="cta-row"><button class="btn btn-primary" id="fmAgain">Play this set again</button><button class="btn btn-ghost" id="fmNext">Try ${esc(seg.items[(fm.set + 1) % seg.items.length].name)}</button></div>`;
  }
  $("#stage").innerHTML = `<div class="fm"><div class="fm-left">${left}</div>${fmBoard()}</div>`;

  // wire up
  if (P === "setup") {
    [0, 1].forEach(p => $("#n" + p).oninput = e => {
      fm.names[p] = e.target.value.trim() || `Player ${p + 1}`;
      $("#h" + p).textContent = fm.names[p];
      if (p === 0) $("#fmGo").textContent = `▶ Start ${fm.names[0]}'s turn`;
    });
    $("#stage").querySelectorAll("[data-set]").forEach(b => b.onclick = () => { fm.set = +b.dataset.set; fmReset(); fmDraw(); });
    $("#fmGo").onclick = () => { fmReset(); fmStart(0); };
  }
  if (P === "p1shown") $("#fmGo").onclick = () => fmStart(1);
  if (P === "p1" || P === "p2") {
    $("#stage").querySelectorAll(".chip").forEach(b => b.onclick = () => fmAnswer(+b.dataset.i));
    $("#fmTimer").onclick = () => { if (fm.timerId) fmStop(); else fmRun(); };
  }
  if (P === "p1done") $("#fmReveal").onclick = () => fmReveal(0);
  if (P === "p2done") $("#fmReveal").onclick = () => fmReveal(1);
  if (P === "result") {
    $("#fmAgain").onclick = () => { fmReset(); fm.phase = "setup"; fmDraw(); };
    $("#fmNext").onclick = () => { fm.set = (fm.set + 1) % state.seg.items.length; fmReset(); fm.phase = "setup"; fmDraw(); };
  }
}
function fmStart(p) {
  fm.phase = p ? "p2" : "p1";
  fm.q = 0;
  fm.left = FM_TIME[p];
  fmDraw();
  fmRun();
}
function fmRun() {
  if (fm.timerId) return;
  const p = fm.phase === "p2" ? 1 : 0;
  const end = Date.now() + fm.left * 1000;
  let lastSec = Math.ceil(fm.left);
  fm.timerId = setInterval(() => {
    fm.left = Math.max(0, (end - Date.now()) / 1000);
    const sec = Math.ceil(fm.left);
    if ($("#fmNum")) {
      $("#fmNum").textContent = sec;
      $("#fmBar").style.strokeDashoffset = CIRC * (1 - fm.left / FM_TIME[p]);
    }
    if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) tone(660, .08); }
    if (fm.left <= 0) { fmEndTurn(); }
  }, 50);
}
function fmStop() { clearInterval(fm.timerId); fm.timerId = null; }
function fmAnswer(i) {
  const p = fm.phase === "p2" ? 1 : 0, Q = state.seg.items[fm.set].qs[fm.q];
  if (i >= Q.answers.length) return;
  const prior = fm.ans[0][fm.q];
  if (p === 1 && i > -1 && prior && prior.i === i) { buzz(); toast("Already said. Try again!"); return; }
  fm.ans[p][fm.q] = i === -1 ? { i: -1, a: "No match", pts: 0 } : { i, a: Q.answers[i].a, pts: Q.answers[i].pts };
  tone(740, .07);
  fm.q++;
  if (fm.q >= 5) fmEndTurn(); else fmDraw();
}
function fmEndTurn() {
  fmStop();
  const p = fm.phase === "p2" ? 1 : 0;
  for (let r = 0; r < 5; r++) if (!fm.ans[p][r]) fm.ans[p][r] = { i: -1, a: "No answer", pts: 0 };
  tone(330, .5);
  fm.phase = p ? "p2done" : "p1done";
  fmDraw();
}
function fmReveal(p) {
  if (fm.busy) return;
  fm.busy = true;
  $("#fmReveal").disabled = true;
  if (p === 1) fm.phase = "p2reveal";
  let r = 0;
  const step = () => {
    if (r >= 5) {
      fm.busy = false;
      fm.phase = p ? "result" : "p1shown";
      fmDraw();
      if (fm.phase === "result" && fm.total >= FM_TARGET) { confetti(320); ding(); setTimeout(ding, 300); }
      return;
    }
    fm.shown[p][r] = true;
    fm.total += fm.ans[p][r].pts;
    $("#stage").querySelector(".fm-board").outerHTML = fmBoard();
    const cell = $(`#c${p}${r}`); if (cell) cell.classList.add("pop");
    fm.ans[p][r].pts > 0 ? tone(988, .2) : tone(150, .3, "sawtooth", .18);
    r++;
    setTimeout(step, 700);
  };
  // uncover player 1's answers when player 2's are revealed
  $("#stage").querySelector(".fm-board").outerHTML = fmBoard();
  setTimeout(step, 300);
}

const MODES = { feud: renderFeud, tenable: renderTenable, fastmoney: renderFastMoney };

/* ---------- Go ---------- */
renderPlayers();
route();
</script>
